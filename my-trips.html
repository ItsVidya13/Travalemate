<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Trips | TravelMate</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">

            <span class="logo-icon">✈</span>

            <span>TravelMate</span>

        </a>


        <nav class="nav-links" id="navLinks">

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Plan Trip
            </a>

            <a href="destinations.html">
                Destinations
            </a>

            <a href="hotels.html">
                Hotels
            </a>

            <a href="my-trips.html"
               class="active">
                My Trips
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="#"
               id="logoutBtn">
                Logout
            </a>

        </nav>


        <button
            class="mobile-menu-btn"
            id="mobileMenuBtn">

            ☰

        </button>

    </div>

</header>



<!-- =====================================================
     PAGE HEADER
===================================================== -->

<section class="page-header">

    <div class="container">

        <h1>
            My Trips
        </h1>

        <p>
            View and manage all your TravelMate journeys.
        </p>

    </div>

</section>



<!-- =====================================================
     MY TRIPS
===================================================== -->

<section class="trips-section">

    <div class="container">


        <!-- PAGE TITLE -->

        <div class="section-heading">

            <span class="section-label">
                YOUR JOURNEYS
            </span>

            <h2>
                Your Travel Plans
            </h2>

            <p>
                Keep track of your upcoming adventures,
                hotels and booking details.
            </p>

        </div>



        <!-- =================================================
             TRIP CONTAINER
        ================================================== -->

        <div id="tripsContainer">

            <!-- JavaScript will insert trip here -->

        </div>


    </div>

</section>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/main.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const container =
            document.getElementById(
                "tripsContainer"
            );


        /* =================================================
           READ LOCAL STORAGE
        ================================================= */

        let trip = null;
        let hotel = null;
        let booking = null;


        try {

            trip =
                JSON.parse(
                    localStorage.getItem(
                        "travelmateTrip"
                    ) || "null"
                );

        } catch (error) {

            trip = null;

        }


        try {

            hotel =
                JSON.parse(
                    localStorage.getItem(
                        "travelmateHotel"
                    ) || "null"
                );

        } catch (error) {

            hotel = null;

        }


        try {

            booking =
                JSON.parse(
                    localStorage.getItem(
                        "travelmateBooking"
                    ) || "null"
                );

        } catch (error) {

            booking = null;

        }



        /* =================================================
           NO TRIP
        ================================================= */

        if (!trip) {

            container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-state-icon">
                        ✈️
                    </div>

                    <h2>
                        No trips yet
                    </h2>

                    <p>
                        You haven't planned a trip yet.
                        Start creating your next adventure!
                    </p>

                    <a
                        href="dashboard.html"
                        class="btn btn-primary">

                        Plan My Trip →

                    </a>

                </div>

            `;

            return;

        }



        /* =================================================
           DESTINATION IMAGE
        ================================================= */

        const destinationImages = {

            "Ooty":
                "assets/images/ooty.jpg",

            "Coorg":
                "assets/images/coorg.jpg",

            "Munnar":
                "assets/images/munnar.jpg",

            "Goa":
                "assets/images/goa.jpg"

        };


        const destinationImage =
            destinationImages[
                trip.destination
            ] ||
            "assets/images/hero.jpg";



        /* =================================================
           TRIP STATUS
        ================================================= */

        let status =
            "Planning";


        let statusColor =
            "#f59e0b";


        if (booking) {

            status =
                "Confirmed";

            statusColor =
                "#16a34a";

        }



        /* =================================================
           HOTEL INFORMATION
        ================================================= */

        const hotelName =
            hotel &&
            hotel.name
                ? hotel.name
                : "Hotel not selected";


        const hotelPrice =
            hotel &&
            hotel.price
                ? "₹" +
                  Number(
                      hotel.price
                  ).toLocaleString(
                      "en-IN"
                  ) +
                  " / night"
                : "Not selected";



        /* =================================================
           BOOKING INFORMATION
        ================================================= */

        const bookingId =
            booking &&
            booking.id
                ? booking.id
                : "Not confirmed";



        /* =================================================
           BUDGET
        ================================================= */

        const budget =
            trip.budget ||
            "Not specified";


        const travelStyle =
            trip.travelStyle ||
            "Not specified";


        const travelers =
            trip.travelers ||
            "Not specified";


        const days =
            trip.days ||
            "Not specified";


        const startingLocation =
            trip.startingLocation ||
            "Not specified";



        /* =================================================
           DISPLAY TRIP
        ================================================= */

        container.innerHTML = `

            <article
                class="trip-card"
                style="
                    padding:0;
                    overflow:hidden;
                    margin-bottom:30px;
                ">


                <!-- =========================================
                     IMAGE
                ========================================== -->

                <div
                    style="
                        position:relative;
                        height:280px;
                        overflow:hidden;
                    ">

                    <img
                        src="${destinationImage}"
                        alt="${trip.destination}"
                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                        "
                        onerror="
                            this.src='assets/images/hero.jpg'
                        ">


                    <div
                        style="
                            position:absolute;
                            inset:0;
                            background:
                            linear-gradient(
                                transparent 35%,
                                rgba(0,0,0,0.75)
                            );
                        ">
                    </div>


                    <!-- STATUS -->

                    <span
                        style="
                            position:absolute;
                            top:18px;
                            right:18px;
                            background:${statusColor};
                            color:white;
                            padding:7px 14px;
                            border-radius:20px;
                            font-size:12px;
                            font-weight:700;
                        ">

                        ${status}

                    </span>


                    <!-- DESTINATION -->

                    <div
                        style="
                            position:absolute;
                            left:25px;
                            bottom:22px;
                            color:white;
                        ">

                        <div
                            style="
                                font-size:13px;
                                opacity:.85;
                                margin-bottom:5px;
                            ">

                            YOUR NEXT ADVENTURE

                        </div>


                        <h2
                            style="
                                font-size:34px;
                                margin:0;
                            ">

                            ${trip.destination}

                        </h2>

                    </div>

                </div>



                <!-- =========================================
                     CONTENT
                ========================================== -->

                <div
                    style="
                        padding:30px;
                    ">


                    <!-- TITLE -->

                    <div
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:flex-start;
                            gap:20px;
                            flex-wrap:wrap;
                            margin-bottom:25px;
                        ">

                        <div>

                            <h2
                                style="
                                    margin-bottom:5px;
                                ">

                                ${trip.destination} Trip

                            </h2>


                            <p
                                style="
                                    color:var(--text);
                                    margin:0;
                                ">

                                ${days} day travel experience

                            </p>

                        </div>


                        <div
                            style="
                                text-align:right;
                            ">

                            <small
                                style="
                                    color:var(--muted);
                                ">

                                TRAVEL STYLE

                            </small>


                            <strong
                                style="
                                    display:block;
                                    color:var(--primary-dark);
                                ">

                                ${travelStyle}

                            </strong>

                        </div>

                    </div>



                    <!-- =====================================
                         DETAILS
                    ====================================== -->

                    <div
                        style="
                            display:grid;
                            grid-template-columns:
                            repeat(
                                auto-fit,
                                minmax(180px,1fr)
                            );
                            gap:15px;
                            margin-bottom:25px;
                        ">


                        <div
                            style="
                                background:#f8fbfc;
                                padding:18px;
                                border-radius:12px;
                                border:1px solid var(--border);
                            ">

                            <small
                                style="
                                    color:var(--muted);
                                    display:block;
                                    margin-bottom:5px;
                                ">

                                STARTING FROM

                            </small>


                            <strong>

                                📍 ${startingLocation}

                            </strong>

                        </div>



                        <div
                            style="
                                background:#f8fbfc;
                                padding:18px;
                                border-radius:12px;
                                border:1px solid var(--border);
                            ">

                            <small
                                style="
                                    color:var(--muted);
                                    display:block;
                                    margin-bottom:5px;
                                ">

                                TRAVELERS

                            </small>


                            <strong>

                                👥 ${travelers}

                            </strong>

                        </div>



                        <div
                            style="
                                background:#f8fbfc;
                                padding:18px;
                                border-radius:12px;
                                border:1px solid var(--border);
                            ">

                            <small
                                style="
                                    color:var(--muted);
                                    display:block;
                                    margin-bottom:5px;
                                ">

                                BUDGET

                            </small>


                            <strong>

                                💰 ${budget}

                            </strong>

                        </div>



                        <div
                            style="
                                background:#f8fbfc;
                                padding:18px;
                                border-radius:12px;
                                border:1px solid var(--border);
                            ">

                            <small
                                style="
                                    color:var(--muted);
                                    display:block;
                                    margin-bottom:5px;
                                ">

                                DURATION

                            </small>


                            <strong>

                                🗓️ ${days} Days

                            </strong>

                        </div>

                    </div>



                    <!-- =====================================
                         HOTEL
                    ====================================== -->

                    <div
                        style="
                            background:#eefafa;
                            border:1px solid #d7eeee;
                            border-radius:14px;
                            padding:20px;
                            margin-bottom:25px;
                        ">

                        <div
                            style="
                                display:flex;
                                justify-content:space-between;
                                align-items:center;
                                gap:15px;
                                flex-wrap:wrap;
                            ">


                            <div>

                                <small
                                    style="
                                        color:var(--primary-dark);
                                        font-weight:700;
                                    ">

                                    HOTEL

                                </small>


                                <h3
                                    style="
                                        margin:5px 0;
                                    ">

                                    🏨 ${hotelName}

                                </h3>


                                <p
                                    style="
                                        color:var(--text);
                                        margin:0;
                                        font-size:13px;
                                    ">

                                    ${hotelPrice}

                                </p>

                            </div>


                            <a
                                href="hotels.html"
                                class="btn btn-primary btn-small">

                                ${hotel ? "Change Hotel" : "Choose Hotel"}

                            </a>

                        </div>

                    </div>



                    <!-- =====================================
                         BOOKING
                    ====================================== -->

                    <div
                        style="
                            border:1px solid var(--border);
                            border-radius:14px;
                            padding:20px;
                            margin-bottom:25px;
                        ">

                        <div
                            style="
                                display:flex;
                                justify-content:space-between;
                                align-items:center;
                                flex-wrap:wrap;
                                gap:15px;
                            ">


                            <div>

                                <small
                                    style="
                                        color:var(--muted);
                                    ">

                                    BOOKING STATUS

                                </small>


                                <h3
                                    style="
                                        margin:5px 0;
                                    ">

                                    ${status}

                                </h3>


                                <p
                                    style="
                                        color:var(--text);
                                        margin:0;
                                        font-size:13px;
                                    ">

                                    Booking ID:
                                    ${bookingId}

                                </p>

                            </div>


                            ${
                                booking
                                ?

                                `<a
                                    href="booking.html"
                                    class="btn btn-secondary btn-small">

                                    View Booking

                                </a>`

                                :

                                hotel

                                ?

                                `<a
                                    href="booking.html"
                                    class="btn btn-primary btn-small">

                                    Complete Booking

                                </a>`

                                :

                                ""

                            }

                        </div>

                    </div>



                    <!-- =====================================
                         ACTIONS
                    ====================================== -->

                    <div
                        style="
                            display:flex;
                            gap:10px;
                            flex-wrap:wrap;
                        ">


                        <a
                            href="trip-summary.html"
                            class="btn btn-primary">

                            View Trip Summary

                        </a>


                        <a
                            href="dashboard.html"
                            class="btn"
                            style="
                                background:#f5f9fc;
                                color:var(--dark);
                                border:1px solid var(--border);
                            ">

                            Plan Another Trip

                        </a>


                        <button
                            type="button"
                            id="deleteTripBtn"
                            class="btn btn-danger">

                            Delete Trip

                        </button>

                    </div>


                </div>

            </article>

        `;



        /* =================================================
           DELETE TRIP
        ================================================= */

        const deleteTripBtn =
            document.getElementById(
                "deleteTripBtn"
            );


        deleteTripBtn.addEventListener(
            "click",
            function () {


                const confirmed =
                    confirm(
                        "Are you sure you want to delete this trip?"
                    );


                if (!confirmed) {

                    return;

                }


                localStorage.removeItem(
                    "travelmateTrip"
                );

                localStorage.removeItem(
                    "travelmateHotel"
                );

                localStorage.removeItem(
                    "travelmateBooking"
                );


                alert(
                    "Trip deleted successfully."
                );


                window.location.reload();

            }
        );

    }

);

</script>


</body>

</html>
