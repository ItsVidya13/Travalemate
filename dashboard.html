<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelMate - Plan Trip</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

</head> <body> <header class="navbar">
<div class="container nav-container">

    <!-- LOGO -->
    <a href="index.html" class="logo">
        <span class="logo-icon">✈</span>
        <span>TravelMate</span>
    </a>

    <!-- NAVIGATION -->
    <nav class="nav-links" id="navLinks">

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html" class="active">
            Plan Trip
        </a>

        <a href="destinations.html">
            Destinations
        </a>

        <a href="hotels.html">
            Hotels
        </a>

        <!-- MY TRIPS -->
        <a href="my-trips.html">
            My Trips
        </a>

        <!-- PROFILE -->
        <a href="profile.html">
            Profile
        </a>

        <!-- LOGOUT -->
        <a href="#" id="logoutBtn" class="nav-login">
            Logout
        </a>

    </nav>

    <!-- MOBILE MENU -->
    <button
        class="mobile-menu-btn"
        id="mobileMenuBtn"
        type="button">
        ☰
    </button>

</div>

</header> <!-- PAGE HEADER --> <section class="page-header">
<div class="container">

    <h1>
        Plan Your Trip
    </h1>

    <p>
        Create a personalized travel experience.
    </p>

</div>

</section> <!-- PLANNER --> <main class="planner-section">
<div class="container">

    <div class="planner-card">

        <h2>
            Trip Details
        </h2>

        <form id="tripForm">

            <div class="form-grid">

                <!-- DESTINATION -->

                <div class="form-group">

                    <label for="destination">
                        Destination
                    </label>

                    <select id="destination" required>

                        <option value="">
                            Select destination
                        </option>

                        <option value="Ooty">
                            Ooty
                        </option>

                        <option value="Coorg">
                            Coorg
                        </option>

                        <option value="Munnar">
                            Munnar
                        </option>

                        <option value="Goa">
                            Goa
                        </option>

                    </select>

                </div>


                <!-- TRAVELERS -->

                <div class="form-group">

                    <label for="travelers">
                        Number of Travelers
                    </label>

                    <input
                        type="number"
                        id="travelers"
                        min="1"
                        value="2"
                        required>

                </div>


                <!-- START DATE -->

                <div class="form-group">

                    <label for="startDate">
                        Start Date
                    </label>

                    <input
                        type="date"
                        id="startDate"
                        required>

                </div>


                <!-- END DATE -->

                <div class="form-group">

                    <label for="endDate">
                        End Date
                    </label>

                    <input
                        type="date"
                        id="endDate"
                        required>

                </div>


                <!-- BUDGET -->

                <div class="form-group">

                    <label for="budget">
                        Budget
                    </label>

                    <select id="budget">

                        <option value="Budget">
                            Budget
                        </option>

                        <option value="Standard">
                            Standard
                        </option>

                        <option value="Luxury">
                            Luxury
                        </option>

                    </select>

                </div>


                <!-- TRAVEL STYLE -->

                <div class="form-group">

                    <label for="travelStyle">
                        Travel Style
                    </label>

                    <select id="travelStyle">

                        <option value="Relaxation">
                            Relaxation
                        </option>

                        <option value="Adventure">
                            Adventure
                        </option>

                        <option value="Nature">
                            Nature
                        </option>

                        <option value="Culture">
                            Culture
                        </option>

                    </select>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="planner-actions">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Create My Trip →

                </button>

                <button
                    type="button"
                    id="resetTrip"
                    class="btn btn-secondary">

                    Reset

                </button>

            </div>

        </form>

    </div>

</div>

</main> <!-- JAVASCRIPT --> <script src="js/main.js"></script> <script src="js/itinerary.js"></script> </body> </html>
